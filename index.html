<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen">
        <div class="setup-card">
            <div class="logo">🔒</div>
            <h1>P2P Chat</h1>
            <p>Private. Encrypted. No servers.</p>
            <input type="text" id="setup-name" placeholder="Enter your name" maxlength="20" autocomplete="off">
            <button id="btn-setup">Get Started</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-screen" class="screen hidden">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="profile">
                    <div class="avatar" id="my-avatar">?</div>
                    <div class="profile-info">
                        <span class="name" id="my-name">Me</span>
                        <span class="session-id" id="my-id" title="Click to copy">Loading...</span>
                    </div>
                </div>
                <button id="btn-add" class="icon-btn" title="Add Contact">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                    </svg>
                </button>
            </div>
            <div id="contacts-list"></div>
        </aside>

        <!-- Chat Area -->
        <main id="chat-area">
            <!-- Empty State -->
            <div id="empty-chat" class="empty-state">
                <div class="empty-icon">💬</div>
                <h2>P2P Chat</h2>
                <p>Select a contact to start chatting</p>
            </div>

            <!-- Active Chat -->
            <div id="active-chat" class="hidden">
                <header class="chat-header">
                    <button id="btn-back" class="icon-btn back-btn" title="Back">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                        </svg>
                    </button>
                    <div class="chat-contact">
                        <div class="avatar" id="chat-avatar">?</div>
                        <div class="contact-info">
                            <span class="name" id="chat-name">Contact</span>
                            <span class="status" id="chat-status">Offline</span>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button id="btn-call" class="icon-btn" title="Voice Call">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z" />
                            </svg>
                        </button>
                        <button id="btn-disconnect" class="icon-btn" title="Disconnect">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12s4.48 10 10 10 10-4.48 10-10zm-2 0c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8 8 3.58 8 8zm-9 4l-4-4h3V8h2v4h3l-4 4z" />
                            </svg>
                        </button>
                        <button id="btn-delete" class="icon-btn danger" title="Delete Chat">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                            </svg>
                        </button>
                    </div>
                </header>
                <div id="messages"></div>
                <footer class="chat-input">
                    <button id="btn-attach" class="icon-btn" title="Attach File">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z" />
                        </svg>
                    </button>
                    <input type="file" id="file-input" hidden accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt">
                    <input type="text" id="msg-input" placeholder="Type a message" autocomplete="off">
                    <button id="btn-voice" class="icon-btn" title="Voice Note">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                        </svg>
                    </button>
                    <button id="btn-send" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                        </svg>
                    </button>
                </footer>
            </div>
        </main>
    </div>

    <!-- Add Contact Modal -->
    <div id="modal-add" class="modal hidden">
        <div class="modal-content">
            <h2>Add Contact</h2>
            <input type="text" id="contact-id" placeholder="Paste their Session ID" autocomplete="off">
            <input type="text" id="contact-name" placeholder="Nickname" maxlength="20" autocomplete="off">
            <div class="modal-actions">
                <button id="btn-cancel" class="secondary">Cancel</button>
                <button id="btn-save">Add</button>
            </div>
        </div>
    </div>

    <!-- Call Modal -->
    <div id="modal-call" class="modal hidden">
        <div class="modal-content call-modal">
            <div class="call-avatar" id="call-avatar">?</div>
            <div class="call-name" id="call-name">Calling...</div>
            <div class="call-status" id="call-status">Connecting...</div>
            <div class="call-timer" id="call-timer"></div>
            <audio id="remote-audio" autoplay></audio>
            <div class="call-actions">
                <button id="btn-mute" class="call-btn mute" title="Mute">
                    <span class="mute-icon">🎤</span>
                </button>
                <button id="btn-accept-call" class="call-btn accept hidden" title="Accept">
                    <span>✓</span>
                </button>
                <button id="btn-decline-call" class="call-btn decline hidden" title="Decline">
                    <span>✕</span>
                </button>
                <button id="btn-end-call" class="call-btn end" title="End Call">
                    <span>📞</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
        <div class="context-item" data-action="copy">
            <span class="icon">📋</span> Copy
        </div>
        <div class="context-item" data-action="reply">
            <span class="icon">↩️</span> Reply
        </div>
        <div class="context-item danger" data-action="delete">
            <span class="icon">🗑️</span> Delete
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
