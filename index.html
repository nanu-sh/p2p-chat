<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat - Private & Encrypted</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🔒 P2P Chat</h2>
            </div>

            <!-- Your ID Section -->
            <div class="your-id-section">
                <label>Your Peer ID (Share this!)</label>
                <div class="id-display">
                    <span id="myPeerId">Connecting...</span>
                    <button class="btn-copy" id="btnCopyId" title="Copy ID">📋</button>
                </div>
                <div class="status" id="connectionStatus">⏳ Connecting to network...</div>
            </div>

            <!-- Connect Section -->
            <div class="connect-section">
                <label>Connect to Friend</label>
                <div class="connect-input-wrapper">
                    <input type="text" id="friendIdInput" placeholder="Enter friend's Peer ID">
                    <button class="btn-connect" id="btnConnect">Connect</button>
                </div>
            </div>

            <!-- Connected Peers -->
            <div class="peers-section">
                <label>Connected Peers</label>
                <div class="peers-list" id="peersList">
                    <p class="no-peers">No connections yet</p>
                </div>
            </div>

            <!-- Clear Data -->
            <div class="clear-data-section">
                <button class="btn-clear-data" id="btnClearData">🗑️ Clear All Data</button>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">💬</div>
                <h3>P2P Encrypted Chat</h3>
                <p>Share your Peer ID with friends to start chatting</p>
                <p class="hint">Messages go directly between browsers — no server!</p>
            </div>

            <div id="chatView" style="display:none;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div class="chat-header-text">
                            <h3 id="chatPeerName">Friend</h3>
                            <span class="encryption-badge">🔐 End-to-end encrypted</span>
                        </div>
                    </div>
                    <div class="call-buttons">
                        <button class="btn-call" id="btnVoiceCall" title="Voice Call">📞</button>
                        <button class="btn-delete-chat" id="btnDeleteChat" title="Delete This Chat">🗑️</button>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="message-input-container">
                    <div class="message-input-wrapper">
                        <button class="btn-media" id="btnAttach" title="Attach Photo/Video">📎</button>
                        <button class="btn-media" id="btnRecordAudio" title="Record Audio">🎙️</button>
                        <input type="text" class="message-input" id="messageInput" placeholder="Type a message...">
                        <button class="btn-send" id="btnSend">➤</button>
                    </div>
                    <input type="file" id="mediaFileInput" accept="image/*,video/*,audio/*" style="display:none">
                </div>
            </div>
        </main>
    </div>

    <!-- Call Overlay -->
    <div class="call-overlay" id="callOverlay">
        <div class="call-info">
            <div class="call-avatar">📞</div>
            <h2 id="callPeerName">Calling...</h2>
            <p class="call-status" id="callStatus">Connecting...</p>
            <span class="call-encryption-badge" id="callEncryptionBadge">🔐 E2E Encrypted</span>
        </div>
        <div class="call-controls">
            <button class="btn-call-control accept" id="btnAcceptCall" style="display:none;">✓</button>
            <button class="btn-call-control end" id="btnEndCall">✕</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
